spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/luxury_car_db
    username: raghavjha
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

jwt:
  secret: luxury-car-secret-key-change-in-production
  expirationSeconds: 86400

services:
  booking:
    base-url: http://localhost:8084

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
